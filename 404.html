<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 Not Found - Halaman tidak ditemukan - HIMTIKA</title>
    <link rel="icon" type="image/png" href="/assets-404/image%205.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Spectral:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInLeft {
        from {
          opacity: 0;
          transform: translateX(-30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
      }
      @keyframes float2 {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(20px);
        }
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        overflow: hidden;
        background-color: #0b1a1a;
        background-image: url("/assets-404/bg.svg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
      body::selection {
        background-color: #e8a020;
        color: white;
      }
      img {
        user-select: none;
      }
      .page {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 0;
      }

      /* Ornamen kiri — Penunjuk arah */
      .page::before {
        content: "";
        position: absolute;
        top: 0;
        left: 2%;
        width: clamp(280px, 32vw, 520px);
        aspect-ratio: 1;
        background: url("/assets-404/ornamen-penunjuk-arah.svg") center /
          contain no-repeat;
        opacity: 0.9;
        z-index: 1;
        pointer-events: none;
        animation: float 4s ease-in-out infinite;
      }
      /* Ornamen kanan — Kompas */
      .page::after {
        content: "";
        position: absolute;
        top: 37%;
        right: 2%;
        width: clamp(280px, 32vw, 520px);
        aspect-ratio: 1;
        background: url("/assets-404/ornamen-kompas.svg") center / contain
          no-repeat;
        opacity: 0.9;
        z-index: 1;
        pointer-events: none;
        animation: float2 4s ease-in-out infinite;
      }

      .content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 620px;
        padding: 12px 20px;
        margin: 0;
        /* max-width: 680px; */
        width: 100%;
        /* padding: 20px 24px; */
        /* margin: auto 0; */
        animation: fadeInUp 1s ease-out;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: clamp(12px, 2.5dvh, 26px);
        animation: fadeInUp 1s ease-out 0.2s both;
      }

      .brand img {
        width: 52px;
        height: 52px;
        object-fit: contain;
      }

      .brand-name {
        font-family: "Spectral", serif;
        font-weight: 400;
        font-size: 18px;
        letter-spacing: 0.12em;
        color: #d4cfc8;
        text-align: left;
      }

      .brand-sub {
        font-size: 11px;
        font-weight: 300;
        letter-spacing: 0.2em;
        color: #6b665e;
        margin-top: 3px;
        text-align: left;
      }

      .heading {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.01em;
        max-width: 100%;
      }

      .heading-code {
        font-size: clamp(4rem, 10vw, 6.5rem);
        color: #e8e2d8;
        animation: fadeInUp 1s ease-out 0.4s both;
      }

      .heading-text {
        font-size: clamp(2rem, 6vw, 3.8rem);
        color: #e8a020;
        margin-top: 2px;
        margin-bottom: 8px;
        max-width: 100%;
        overflow-wrap: anywhere;
        animation: fadeInUp 1s ease-out 0.6s both;
      }

      .ornament-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 8px 0 16px;
        animation: fadeInUp 1s ease-out 0.8s both;
      }

      .ornament-row svg {
        animation: pulse 2s ease-in-out infinite;
      }

      .orn-line {
        width: 90px;
        height: 1px;
        background: linear-gradient(
          to right,
          transparent,
          rgba(200, 160, 64, 0.4),
          #c8a040
        );
      }

      .orn-line.reverse {
        background: linear-gradient(
          to left,
          transparent,
          rgba(200, 160, 64, 0.4),
          #c8a040
        );
      }

      .description {
        margin-bottom: clamp(16px, 2.5dvh, 26px);
        animation: fadeInUp 1s ease-out 1s both;
      }

      .desc-title {
        font-size: clamp(16px, 2vw, 21px);
        font-weight: 600;
        color: #e8e2d8;
        line-height: 1.4;
        margin-bottom: 8px;
      }

      .desc-text {
        font-size: clamp(13px, 1.5vw, 17px);
        line-height: 1.5;
        font-weight: 400;
        color: #bdb7ad;
        max-width: 460px;
        margin: 0 auto;
      }

      .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: linear-gradient(135deg, #e8a020, #d4941a);
        border: none;
        border-radius: 9999px;
        padding: 12px 32px;
        text-decoration: none;
        transition: all 0.3s ease;
        color: #1a1a1a;
        box-shadow: 0 4px 15px rgba(232, 160, 32, 0.3);
        animation: fadeInUp 1s ease-out 1.2s both;
      }

      .btn-back:hover,
      .btn-back:focus-visible {
        background: linear-gradient(135deg, #f0a830, #e8a020);
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 8px 25px rgba(232, 160, 32, 0.5);
      }

      .social-media {
        display: flex;
        gap: 15px;
        margin-top: clamp(20px, 5dvh, 36px);
        justify-content: center;
        z-index: 20;
        animation: fadeInUp 1s ease-out 1.4s both;
      }

      .social-icon {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: all 0.3s ease;
        color: #ffffff;
        animation: fadeInLeft 0.6s ease-out calc(1.6s + var(--delay, 0s)) both;
      }

      .social-icon:nth-child(1) {
        --delay: 0s;
      }
      .social-icon:nth-child(2) {
        --delay: 0.1s;
      }
      .social-icon:nth-child(3) {
        --delay: 0.2s;
      }
      .social-icon:nth-child(4) {
        --delay: 0.3s;
      }

      .social-icon:hover,
      .social-icon:focus-visible {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.4);
        transform: translateY(-3px) scale(1.1);
        box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
      }

      .social-icon svg {
        width: 24px;
        height: 24px;
        fill: url(#socialGradient);
      }

      /* Tablet */
      @media (min-width: 481px) and (max-width: 1024px) {
        .page::before {
          top: 16%;
          left: -7%;
          width: clamp(200px, 30vw, 310px);
          opacity: 0.7;
        }
        .page::after {
          top: 55%;
          right: -7%;
          width: clamp(200px, 30vw, 310px);
          opacity: 0.7;
        }
        .content {
          max-width: 560px;
        }
      }

      /* Mobile */
      @media (max-width: 480px) {
        .page {
          height: 100svh;
        }
        .content {
          padding: 8px 16px;
          max-width: 100%;
        }
        .brand {
          gap: 8px;
          margin-bottom: 46px;
        }
        .brand img {
          width: 38px;
          height: 38px;
        }
        .brand-name {
          font-size: 14px;
        }
        .brand-sub {
          font-size: 9px;
        }
        .heading-code {
          font-size: clamp(60px, 18vw, 82px);
        }
        .heading-text {
          font-size: clamp(28px, 8.5vw, 38px);
          margin-bottom: 6px;
          white-space: nowrap;
        }
        .ornament-row {
          margin: 6px 0 12px;
        }
        .orn-line {
          width: 65px;
        }
        .description {
          margin-bottom: 20px;
        }
        .desc-title {
          font-size: 15px;
          margin-bottom: 6px;
        }
        .desc-text {
          font-size: 13px;
          line-height: 1.5;
          max-width: 310px;
        }
        .btn-back {
          padding: 10px 26px;
        }
        .social-media {
          margin-top: 44px;
          gap: 14px;
        }
        .social-icon {
          width: 42px;
          height: 42px;
        }
        .social-icon svg {
          width: 19px;
          height: 19px;
        }
        /* Penunjuk arah di kiri atas */
        .page::before {
          top: 5%;
          left: -4%;
          width: 225px;
          opacity: 0.8;
        }

        /* Kompas di kanan bawah */
        .page::after {
          top: 62%;
          right: -4%;
          width: 225px;
          opacity: 0.8;
        }
      }

      @media (max-height: 650px) {
        .brand {
          margin-bottom: 8px;
        }
        .heading-code {
          font-size: clamp(48px, 11dvh, 72px);
        }
        .heading-text {
          font-size: clamp(24px, 6dvh, 36px);
        }
        .ornament-row {
          margin: 4px 0 8px;
        }
        .description {
          margin-bottom: 12px;
        }
        .social-media {
          margin-top: 14px;
        }
        .social-icon {
          width: 38px;
          height: 38px;
        }
      }

      /* Loader */
      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #1f0408 0%, #031208 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition:
          opacity 0.8s cubic-bezier(0.65, 0, 0.35, 1),
          visibility 0.8s;
        /* Fail-safe: jika JS gagal, loader tetap hilang setelah 4 detik */
        animation: loader-failsafe 0.8s ease 4s forwards;
      }

      #loader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes loader-failsafe {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }

      .spinner-box {
        position: relative;
        width: 100px;
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .circle-border {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #e8a020;
        border-bottom-color: #e8a020;
        animation: spin-loader 1.5s linear infinite;
      }

      .circle-core {
        position: absolute;
        width: 70%;
        height: 70%;
        border-radius: 50%;
        border: 3px solid transparent;
        border-left-color: #d4cfc8;
        border-right-color: #d4cfc8;
        animation: spin-loader 1.5s linear infinite reverse;
      }

      .brand-glow {
        position: absolute;
        width: 40%;
        height: 40%;
        background: #e8a020;
        border-radius: 50%;
        filter: blur(15px);
        animation: pulse-glow-loader 2s ease-in-out infinite;
      }

      @keyframes spin-loader {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse-glow-loader {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.8);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.2);
        }
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }

        /* Loader fail-safe tetap harus menghilang tanpa animasi */
        #loader {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <svg
      width="0"
      height="0"
      style="position: absolute"
      aria-hidden="true"
      focusable="false"
    >
      <defs>
        <linearGradient id="socialGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color: #e8a020; stop-opacity: 1" />
          <stop offset="100%" style="stop-color: #ff6b9d; stop-opacity: 1" />
        </linearGradient>
      </defs>
    </svg>

    <div id="loader" aria-hidden="true">
      <div class="spinner-box">
        <div class="circle-border"></div>
        <div class="circle-core"></div>
        <div class="brand-glow"></div>
      </div>
    </div>

    <div class="page">

            <p class="brand-name">KABINET SELARAS</p>
            <p class="brand-sub">HIMTIKA 2025-2026</p>
          </div>
        </div>

        <h1 class="heading">
          <span class="heading-code">404</span>
          <span class="heading-text">NOT FOUND!</span>
        </h1>

        <div class="ornament-row" aria-hidden="true">
          <div class="orn-line"></div>
          <svg
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"

          >
            <circle cx="10" cy="10" r="3" fill="#c8a040" />
            <path
              d="M10 1.5 L11 7.5 L10 10 L9 7.5Z"

            <path

              opacity="0.75"

            <path
              d="M1.5 10 L7.5 9 L10 10 L7.5 11Z"
              fill="#c8a040"
              opacity="0.75"
            />
            <path

              opacity="0.75"
            />
          </svg>
          <div class="orn-line reverse"></div>
        </div>

        <div class="description">
          <p class="desc-title">Oops! Sepertinya kamu tersesat.</p>
          <p class="desc-text">
            Halaman yang kamu cari tidak ditemukan atau sudah tidak tersedia.
          </p>
        </div>

        <a href="https://himtika.cs.unsika.ac.id/" class="btn-back">
          <svg

            height="20"
            viewBox="0 0 20 20"

              stroke-linejoin="round"
            />
          </svg>
          <span
            style="font-size: 13px; font-weight: 500; letter-spacing: 0.16em"
            >Kembali</span
          >
        </a>

        <div class="social-media">
          <a
            href="https://www.tiktok.com/@himtika_unsika"
            target="_blank"
            class="social-icon"
            title="TikTok"
            aria-label="TikTok"
          >

          <a

          >
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"

          <a

          >
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"
              />
            </svg>
          </a>
        </div>
      </main>
    </div>

    <script>
      (function () {
        var loader = document.getElementById("loader");
        function hideLoader() {
          if (loader) loader.classList.add("fade-out");
        }
        window.addEventListener("load", function () {
          setTimeout(hideLoader, 1000);
        });
        // Cadangan jika event load tidak pernah terpicu (aset lambat/gagal)
        setTimeout(hideLoader, 3500);
      })();
    </script>
  </body>
</html>
